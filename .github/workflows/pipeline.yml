name: Pipeline
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'packages/**/src/**'
      - 'packages/**/package.json'
      - '.changeset/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'packages/**/src/**'
      - 'packages/**/package.json'
      - '.changeset/**'
      - '.github/workflows/pipeline.yml'
  # An approving review is what releases a preview, further down. `paths` is not
  # available here, so this runs the pipeline again for the reviewed commit —
  # which is wanted anyway, since nothing should be published untested.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel in-progress runs on PRs (new push makes old run irrelevant)
  # but never cancel on main (could interrupt a release)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A review event checks out the base branch by default, which would test and
  # then publish the wrong code entirely. Empty for every other event, which
  # leaves checkout on the default it already had.
  CHECKOUT_REF: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.head.sha || '' }}

jobs:
  build:
    name: Building
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: ./.github/actions/node

      - name: Build all packages
        run: pnpm build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist/
          retention-days: 1

  check:
    name: Type Checking
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: ./.github/actions/node

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Run the type checker
        run: pnpm check --filter "./packages/*"

  lint:
    name: Linting
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: ./.github/actions/node

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Run the linter
        run: pnpm lint

  test:
    name: Testing
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: ./.github/actions/node

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Run tests with coverage
        run: pnpm coverage

      # Single upload of the merged report, tagged with every package flag.
      # Each flag's `paths:` in codecov.yml slices the report server-side, so
      # one upload feeds all the per-package coverage badges.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/lcov.info
          flags: config,format-po,integration,integration-carbon,integration-react,plugin-babel,plugin-unplugin,transform-js,transform-jsx

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage/
          retention-days: 7

  # A preview is an installable package and a link that runs its code, so it is
  # gated on an approving review from someone with write access — which is what
  # pkg.pr.new itself recommends, and keeps a drive-by pull request from minting
  # one for itself. The review event fires for every submitted review, including
  # a comment from anyone at all, so this is checked before anything is built.
  authorize:
    name: Checking Authorization
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request_review' && github.event.review.state == 'approved' }}
    outputs:
      approved: ${{ steps.permission.outputs.require-result }}
    permissions:
      contents: read

    steps:
      - name: Check reviewer permissions
        id: permission
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.event.review.user.login }}

  preview:
    name: Publishing Preview
    needs: [check, lint, test, authorize]
    if: ${{ needs.authorize.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: ./.github/actions/node

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      # `--peerDeps` points the cross-package peer ranges at the matching preview
      # build, so installing one package pulls the rest of the set from this
      # commit rather than from the registry.
      - name: Publish preview packages
        run: pnpm exec pkg-pr-new publish --pnpm --peerDeps './packages/*'

      # A preview is only worth publishing if it is easy to try, so the pull request
      # gets a link that opens the playground already pointed at this commit's build.
      # One comment, rewritten on each further approval rather than piling up — the
      # marker is how the previous one is found.
      - name: Link the preview from the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- playground-preview -->'
          commit="${SHA:0:7}"
          body="$(printf '%s\nThe preview build of `%s` is published. [Open it in the playground](https://saykit.js.org/playground?preview=%s) to run this pull request against your own code, straight from the browser.' "$marker" "$commit" "$commit")"

          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$body"
          fi

  process:
    name: Processing Changesets
    needs: [check, lint, test]
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: ./.github/actions/node

      # Only maintains the version PR. Publishing is done below so that a
      # release produces one tag and one GitHub release for the whole
      # workspace, rather than one of each per package.
      - name: Process changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run release:version
          title: 'Pending Releases'
          commit: 'Update changelog and release'

      # `changeset publish` skips anything already on the registry, so this is
      # safe to re-run: a rerun after a partial failure publishes the remainder.
      - name: Publish packages
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        run: pnpm run release:publish

      - name: Build release notes
        id: notes
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        run: node scripts/release-notes.mjs

      # Driven by the version on disk rather than by whether this run happened
      # to publish, so a rerun can finish a release whose tag or GitHub release
      # was left behind by an earlier failure. Both are no-ops once they exist.
      - name: Tag and create release
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo 'No shared version to release.'
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file RELEASE_NOTES.md
          fi

  snapshot:
    name: Releasing Snapshot
    needs: [process]
    runs-on: ubuntu-latest
    # Betas exist to preview changes that are waiting on a release, so this
    # keys off pending changesets rather than off whether a publish happened.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.process.outputs.hasChangesets == 'true' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: ./.github/actions/node

      - name: Publish snapshot version
        run: |
          pnpm run release:snapshot:version
          pnpm run release:snapshot:publish
