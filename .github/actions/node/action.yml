name: Setup Node.js
description: Setup Node.js, PNPM, and install dependencies

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install
      shell: bash

    # Turbo already declares `inputs` and `outputs` per task, so a warm cache
    # turns most of a run into replayed output. The key is per job so the four
    # that run in parallel never race to write the same entry, and the fallbacks
    # widen to any earlier cache, since a partial hit still beats a cold build.
    - name: Cache Turbo
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-
          ${{ runner.os }}-turbo-
